server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: api-finance-ia
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/softwave?createDatabaseIfNotExist=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:cris2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

