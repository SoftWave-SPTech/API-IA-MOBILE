  timeout-ms: ${OPENROUTER_TIMEOUT_MS:30000}
  max-output-tokens: ${OPENROUTER_MAX_OUTPUT_TOKENS:900}
  temperature: ${OPENROUTER_TEMPERATURE:0.4}
  app-name: ${OPENROUTER_APP_NAME:API-FINANCE-IA}
  app-url: ${OPENROUTER_APP_URL:http://localhost:8084}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:19006}

# URLs dos microsservicos financeiros (contrato em docs/CONTRATO_INTEGRACAO_BACK_FINANCEIRO.md)
services:
  transacoes:
    url: ${SERVICES_TRANSACOES_URL:http://localhost:8080}
  cobrancas:
    url: ${SERVICES_COBRANCAS_URL:http://localhost:8080}
  clientes:
    url: ${SERVICES_CLIENTES_URL:http://localhost:8080}

features:
  # true = ignora banco/Feign e usa numeros fixos de demonstracao
  usar-metricas-mock: ${USAR_METRICAS_MOCK:false}
  # banco = transacao + honorario + registro_financeiro (MySQL configurado em spring.datasource)
  # feign = microsservicos em services.*.url (contrato em docs/)
  fonte-metricas: ${FONTE_METRICAS:banco}
  # tenantId da API = cliente_id em registro_financeiro (multi-escritorio: ajuste depois)
  metricas-tenant-eh-cliente-id: ${METRICAS_TENANT_EH_CLIENTE_ID:true}
  # regras de classificacao; pode ajustar sem mexer no codigo
  metricas:
    tipo-receita-valores: ${METRICAS_TIPO_RECEITA_VALORES:1,R,RECEITA,ENTRADA,CREDITO}
    tipo-despesa-valores: ${METRICAS_TIPO_DESPESA_VALORES:2,S,DESPESA,SAIDA,DEBITO}
    status-pago-valores: ${METRICAS_STATUS_PAGO_VALORES:1,PAGO,QUITADO,RECEBIDO}
  # se a fonte escolhida falhar (ex.: DB fora ou Feign 503), volta ao mock em vez de quebrar
  fallback-metricas-mock-em-falha: ${FALLBACK_METRICAS_MOCK_EM_FALHA:true}
