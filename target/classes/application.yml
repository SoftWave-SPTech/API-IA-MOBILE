server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: api-finance-ia
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/softwave?createDatabaseIfNotExist=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:cris2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

gemini:
  api-key: ${GEMINI_API_KEY:AIzaSyBsFFonpHti3p5LUFjA8UGXmPbGgJIQgLg}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:900}
  temperature: ${GEMINI_TEMPERATURE:0.4}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

# URLs dos microsservicos financeiros (contrato em docs/CONTRATO_INTEGRACAO_BACK_FINANCEIRO.md)
services:
  transacoes:
    url: ${SERVICES_TRANSACOES_URL:http://localhost:8080}
  cobrancas:
    url: ${SERVICES_COBRANCAS_URL:http://localhost:8080}
  clientes:
    url: ${SERVICES_CLIENTES_URL:http://localhost:8080}

features:
  # true = usa numeros mock (faculdade / back ainda nao pronto)
  usar-metricas-mock: ${USAR_METRICAS_MOCK:true}
  # se false e a chamada Feign falhar, volta ao mock em vez de quebrar a demo
  fallback-metricas-mock-em-falha: ${FALLBACK_METRICAS_MOCK_EM_FALHA:true}
